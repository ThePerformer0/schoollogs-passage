{% extends "passage/base.html" %}
{% block title %}Connexion — SchoolLogs Passage{% endblock %}
{% block content %}
<h1>Connexion</h1>
{% if error_message %}
<p role="alert">{{ error_message }}</p>
{% endif %}
<form method="post" action="{% url 'passage:login' %}">
    {% csrf_token %}
    <div>
        <label for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
        {{ form.username }}
    </div>
    <div>
        <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
        {{ form.password }}
    </div>
    <button type="submit">Se connecter</button>
</form>
{% endblock %}
