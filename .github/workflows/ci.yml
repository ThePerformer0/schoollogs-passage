name: CI — Tests Passage

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier l'absence de fichier .env versionné
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERREUR : un fichier .env est versionné dans le dépôt."
            exit 1
          fi

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les vérifications système Django
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-ephemeral-test-secret-key-do-not-use-in-production-0123456789"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          CLE_API_IA: ""
          DEMO_MODE: "0"
        run: python manage.py check

      - name: Exécuter la suite de tests
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-ephemeral-test-secret-key-do-not-use-in-production-0123456789"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          CLE_API_IA: ""
          DEMO_MODE: "0"
        run: python manage.py test --verbosity=2
